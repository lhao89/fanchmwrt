name: mtk-closed-build

on:
  workflow_dispatch:
    inputs:
      BUILD_DATE:
        description: '固件发布日期，留空则使用当天日期'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  REBASE_TARBALL: https://codeload.github.com/chasey-dev/immortalwrt-mt798x-rebase/tar.gz/refs/heads/25.12

jobs:
  build:
    name: AX3000T V1 闭源驱动固件（fanchmwrt 25.12.4）
    runs-on: ubuntu-22.04

    steps:
    - name: 检查分支
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: 释放磁盘空间
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo docker image prune -a -f
        sudo systemctl stop docker
        sudo snap set system refresh.retain=2
        sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo rm -rf /etc/mysql /etc/php /usr/lib/jvm /usr/libexec/docker /usr/local /usr/src/* /var/lib/docker /var/lib/gems /var/lib/mysql /var/lib/snapd /etc/skel /opt/{microsoft,az,hostedtoolcache,cni,mssql-tools,pipx} /usr/share/{az*,dotnet,swift,miniconda,gradle*,java,kotlinc,ri,sbt} /root/{.sbt,.local,.npm}
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        rm -rf ~/{.cargo,.dotnet,.rustup}
        df -Th

    - name: 编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils clang llvm
        sudo apt-get clean
        git config --global user.name 'GitHub Actions' && git config --global user.email 'noreply@github.com'
        sudo timedatectl set-timezone 'Asia/Shanghai'
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -Th

    - name: 下载闭源参考树（immortalwrt-mt798x-rebase 25.12）
      run: |
        cd /workdir
        curl -L -o rebase.tar.gz "${{ env.REBASE_TARBALL }}"
        tar -xzf rebase.tar.gz
        mv immortalwrt-mt798x-rebase-25.12 /workdir/rebase
        echo "rebase patches: $(ls /workdir/rebase/target/linux/mediatek/patches-6.12 | wc -l)"
        echo "rebase package/mtk: $(ls /workdir/rebase/package/mtk | wc -l)"

    - name: 移植闭源驱动（对齐 rebase 内核补丁体系 + 复制 package/mtk）
      run: |
        set -e
        cd $GITHUB_WORKSPACE
        # 0) 备份 fanchmwrt 特有内核补丁（fwx 依赖 nf_conn.fwx_data 字段，由官方 hack 补丁定义）
        mkdir -p /workdir/fanch-patches/hack /workdir/fanch-patches/pending /workdir/fanch-patches/backport /workdir/fanch-patches/mtk
        cp target/linux/generic/hack-6.12/950-fwx-*.patch /workdir/fanch-patches/hack/
        cp target/linux/generic/pending-6.12/303-Revert-*.patch /workdir/fanch-patches/pending/
        cp target/linux/generic/backport-6.12/200-01-v6.13-jiffies-*.patch target/linux/generic/backport-6.12/200-02-v6.14-jiffies-*.patch target/linux/generic/backport-6.12/401-v6.17-mtd-spinand-*.patch target/linux/generic/backport-6.12/404-v6.19-mtd-spinand-*.patch target/linux/generic/backport-6.12/429-*-v6.18-mtd-spinand-*.patch target/linux/generic/backport-6.12/620-v6.15-ppp-*.patch target/linux/generic/backport-6.12/621-v6.17-ppp-*.patch target/linux/generic/backport-6.12/625-v7.0-ppp-*.patch /workdir/fanch-patches/backport/
        cp target/linux/mediatek/patches-6.12/340-mtd-spinand-*.patch target/linux/mediatek/patches-6.12/601-PCI-mediatek-*.patch /workdir/fanch-patches/mtk/
        echo "备份 fanchmwrt 特有补丁: hack=$(ls /workdir/fanch-patches/hack | wc -l) pending=$(ls /workdir/fanch-patches/pending | wc -l) backport=$(ls /workdir/fanch-patches/backport | wc -l) mtk=$(ls /workdir/fanch-patches/mtk | wc -l)"
        # 1) 整体替换 mediatek 平台层（补丁/files/dts/config/镜像定义全部来自闭源源树）
        rm -rf target/linux/mediatek
        cp -r /workdir/rebase/target/linux/mediatek target/linux/mediatek
        # 2) 对齐 generic 内核层到 rebase（版本 6.12.108 + 配套补丁/内核配置，闭源补丁以 .108 为基线）
        cp /workdir/rebase/target/linux/generic/kernel-6.12 target/linux/generic/kernel-6.12
        cp /workdir/rebase/target/linux/generic/config-6.12 target/linux/generic/config-6.12
        for d in backport-6.12 hack-6.12 pending-6.12; do
          rm -rf target/linux/generic/$d
          cp -r /workdir/rebase/target/linux/generic/$d target/linux/generic/$d
        done
        grep "LINUX_VERSION-6.12" target/linux/generic/kernel-6.12
        # 2.5) 恢复 fanchmwrt 特有内核补丁（fwx 的 nf_conn.fwx_data 必需；mediatek 特有补丁放顶层 patches-6.12）
        cp /workdir/fanch-patches/hack/*.patch target/linux/generic/hack-6.12/
        cp /workdir/fanch-patches/pending/*.patch target/linux/generic/pending-6.12/
        cp /workdir/fanch-patches/backport/*.patch target/linux/generic/backport-6.12/
        # 排除与 rebase 重复的补丁：复旦微 FM25S01A 支持 rebase 已有 401-01/401-02（v6.18），fanchmwrt 401(v6.17)/404(v6.19) 功能重复且会撞上下文
        rm -f target/linux/generic/backport-6.12/401-v6.17-mtd-spinand-add-support-for-FudanMicro-FM25S01A.patch
        rm -f target/linux/generic/backport-6.12/404-v6.19-mtd-spinand-fmsh-remove-QE-bit-for-FM25S01A-flash.patch
        echo "排除重复复旦微补丁后 backport 计数: $(ls target/linux/generic/backport-6.12 | wc -l)"
        cp /workdir/fanch-patches/mtk/*.patch target/linux/mediatek/patches-6.12/
        # 2.6) 修正 fanchmwrt 200-01 补丁：删除 hci_event.c hunk（immortalwrt 6.12.108 该文件上下文不匹配，已由诊断证实 Hunk FAILED at 42；jiffies.h 全局宏保留，fwx/按键驱动依赖）
        sed -i '/^--- a\/net\/bluetooth\/hci_event.c$/,$d' target/linux/generic/backport-6.12/200-01-v6.13-jiffies-Define-secs_to_jiffies.patch
        echo "200-01 修正后剩余目标文件数（应为 1）: $(grep -c '^--- a/' target/linux/generic/backport-6.12/200-01-v6.13-jiffies-Define-secs_to_jiffies.patch)"
        echo "恢复后 hack-6.12 含 950-fwx: $(ls target/linux/generic/hack-6.12/950-* 2>/dev/null | wc -l) 个, mediatek/patches-6.12: $(ls target/linux/mediatek/patches-6.12 | wc -l) 个"
        # 3) 复制闭源驱动编译包
        rm -rf package/mtk
        cp -r /workdir/rebase/package/mtk package/mtk
        # 4) 补齐缺失的依赖包定义（官方树没有，闭源驱动必需）
        #    kmod-mediatek_hnat 内核模块定义在 netdevices.mk（rebase 为官方超集，可整体替换）
        cp /workdir/rebase/package/kernel/linux/modules/netdevices.mk package/kernel/linux/modules/netdevices.mk
        #    iwinfo-ucode / ucode-mod-iwinfo（mtwifi-cfg 依赖，官方树无此包）
        rm -rf package/network/utils/iwinfo-ucode
        cp -r /workdir/rebase/package/network/utils/iwinfo-ucode package/network/utils/iwinfo-ucode
        # 5) 核对
        echo "mediatek/patches-6.12: $(ls target/linux/mediatek/patches-6.12 | wc -l) 个补丁"
        echo "generic backport: $(ls target/linux/generic/backport-6.12 | wc -l) hack: $(ls target/linux/generic/hack-6.12 | wc -l) pending: $(ls target/linux/generic/pending-6.12 | wc -l)"
        echo "mtk package: $(ls package/mtk)"
        echo "hnat pkg: $(grep -c 'define KernelPackage/mediatek_hnat' package/kernel/linux/modules/netdevices.mk)"
        echo "iwinfo-ucode: $(ls package/network/utils/iwinfo-ucode)"
        grep -n "xiaomi_mi-router-ax3000t" target/linux/mediatek/image/filogic.mk | head -3
        grep -n "kmod-mt_wifi" target/linux/mediatek/image/filogic.mk | head -3

    - name: 更新 feeds（官方 feeds + fanchmwrt-packages）
      run: |
        cd $GITHUB_WORKSPACE
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 生成配置（AX3000T V1 stock 布局 + 闭源驱动，完整复刻 fanchmwrt）
      run: |
        cd $GITHUB_WORKSPACE
        cat > .config <<'EOF'
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
        # ===== MTK 闭源驱动核心包 =====
        CONFIG_PACKAGE_kmod-conninfra=y
        CONFIG_PACKAGE_kmod-mediatek_hnat=y
        CONFIG_PACKAGE_kmod-mt_wifi=y
        CONFIG_PACKAGE_kmod-warp=y
        CONFIG_PACKAGE_kmod-nf-flow=y
        CONFIG_PACKAGE_iwinfo-ucode=y
        CONFIG_PACKAGE_mtwifi-cfg-ucode=y
        CONFIG_PACKAGE_luci-app-mtwifi-cfg=y
        CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y
        # ===== 驱动编译选项（MT7981 / AX3000T，源自 rebase 官方 defconfig） =====
        CONFIG_CONNINFRA_AUTO_UP=y
        CONFIG_CONNINFRA_EMI_SUPPORT=y
        CONFIG_MTK_ACK_CTS_TIMEOUT_SUPPORT=y
        CONFIG_MTK_AIR_MONITOR=y
        CONFIG_MTK_AMPDU_CONF_SUPPORT=y
        CONFIG_MTK_ANTENNA_CONTROL_SUPPORT=y
        CONFIG_MTK_APCLI_SUPPORT=y
        CONFIG_MTK_ATE_SUPPORT=y
        CONFIG_MTK_BACKGROUND_SCAN_SUPPORT=y
        CONFIG_MTK_CAL_BIN_FILE_SUPPORT=y
        CONFIG_MTK_CFG_SUPPORT_FALCON_MURU=y
        CONFIG_MTK_CFG_SUPPORT_FALCON_PP=y
        CONFIG_MTK_CFG_SUPPORT_FALCON_SR=y
        CONFIG_MTK_CFG_SUPPORT_FALCON_TXCMD_DBG=y
        CONFIG_MTK_CHIP_MT7981=y
        CONFIG_MTK_CONNINFRA_APSOC=y
        CONFIG_MTK_CONNINFRA_APSOC_MT7981=y
        CONFIG_MTK_CON_WPS_SUPPORT=y
        CONFIG_MTK_DBDC_MODE=y
        CONFIG_MTK_DOT11K_RRM_SUPPORT=y
        CONFIG_MTK_DOT11R_FT_SUPPORT=y
        CONFIG_MTK_DOT11W_PMF_SUPPORT=y
        CONFIG_MTK_DOT11_HE_AX=y
        CONFIG_MTK_DOT11_N_SUPPORT=y
        CONFIG_MTK_DOT11_VHT_AC=y
        CONFIG_MTK_FAST_NAT_SUPPORT=y
        CONFIG_MTK_FIRST_IF_EEPROM_FLASH=y
        CONFIG_MTK_FIRST_IF_IPAILNA=y
        CONFIG_MTK_FIRST_IF_MT7981=y
        CONFIG_MTK_GREENAP_SUPPORT=y
        CONFIG_MTK_G_BAND_256QAM_SUPPORT=y
        CONFIG_MTK_HDR_TRANS_RX_SUPPORT=y
        CONFIG_MTK_HDR_TRANS_TX_SUPPORT=y
        CONFIG_MTK_ICAP_SUPPORT=y
        CONFIG_MTK_IGMP_SNOOP_SUPPORT=y
        CONFIG_MTK_INTERWORKING=y
        CONFIG_MTK_MAP_R2_VER_SUPPORT=y
        CONFIG_MTK_MAP_R3_VER_SUPPORT=y
        CONFIG_MTK_MAP_SUPPORT=y
        CONFIG_MTK_MBSS_DTIM_SUPPORT=y
        CONFIG_MTK_MBSS_SUPPORT=y
        CONFIG_MTK_MCAST_RATE_SPECIFIC=y
        CONFIG_MTK_MEMORY_SHRINK=y
        CONFIG_MTK_MEMORY_SHRINK_AGGRESS=y
        CONFIG_MTK_MGMT_TXPWR_CTRL=y
        CONFIG_MTK_MLME_MULTI_QUEUE_SUPPORT=y
        CONFIG_MTK_MT_AP_SUPPORT=m
        CONFIG_MTK_MT_DFS_SUPPORT=y
        CONFIG_MTK_MT_MAC=y
        CONFIG_MTK_MT_WIFI=m
        CONFIG_MTK_MT_WIFI_DRIVER_VERSION_7673=y
        CONFIG_MTK_MT_WIFI_FIRMWARE_PATH_MT7981="mt7981-fw-20260601"
        CONFIG_MTK_MT_WIFI_MT7981_20260601=y
        CONFIG_MTK_MT_WIFI_PATH="mt_wifi"
        CONFIG_MTK_MUMIMO_SUPPORT=y
        CONFIG_MTK_MU_RA_SUPPORT=y
        CONFIG_MTK_OFFCHANNEL_SCAN_FEATURE=y
        CONFIG_MTK_OWE_SUPPORT=y
        CONFIG_MTK_QOS_R1_SUPPORT=y
        CONFIG_MTK_RA_PHY_RATE_SUPPORT=y
        CONFIG_MTK_RED_SUPPORT=y
        CONFIG_MTK_RTMP_FLASH_SUPPORT=y
        CONFIG_MTK_RT_FIRST_CARD_EEPROM="flash"
        CONFIG_MTK_RT_FIRST_IF_RF_OFFSET=0xc0000
        CONFIG_MTK_SCS_FW_OFFLOAD=y
        CONFIG_MTK_SECOND_IF_NONE=y
        CONFIG_MTK_SMART_CARRIER_SENSE_SUPPORT=y
        CONFIG_MTK_SPECTRUM_SUPPORT=y
        CONFIG_MTK_SUPPORT_OPENWRT=y
        CONFIG_MTK_THIRD_IF_NONE=y
        CONFIG_MTK_TPC_SUPPORT=y
        CONFIG_MTK_TXBF_SUPPORT=y
        CONFIG_MTK_UAPSD=y
        CONFIG_MTK_VLAN_SUPPORT=y
        CONFIG_MTK_VOW_SUPPORT=y
        CONFIG_MTK_WARP_V2=y
        CONFIG_MTK_WDS_SUPPORT=y
        CONFIG_MTK_WHNAT_SUPPORT=m
        CONFIG_MTK_WIFI_BASIC_FUNC=y
        CONFIG_MTK_WIFI_DRIVER=y
        CONFIG_MTK_WIFI_EAP_FEATURE=y
        CONFIG_MTK_WIFI_FW_BIN_LOAD=y
        CONFIG_MTK_WIFI_MODE_AP=m
        CONFIG_MTK_WIFI_MT_MAC=y
        CONFIG_MTK_WIFI_TWT_SUPPORT=y
        CONFIG_MTK_WLAN_HOOK=y
        CONFIG_MTK_WLAN_SERVICE=y
        CONFIG_MTK_WNM_SUPPORT=y
        CONFIG_MTK_WPA3_SUPPORT=y
        CONFIG_MTK_WSC_INCLUDED=y
        CONFIG_MTK_WSC_V2_SUPPORT=y
        CONFIG_WARP_CHIPSET="mt7981"
        CONFIG_WARP_DBG_SUPPORT=y
        CONFIG_WARP_VERSION=2
        CONFIG_WED_HW_RRO_SUPPORT=y
        CONFIG_first_card=y
        CONFIG_first_card_name="MT7981"
        # CONFIG_MTK_BAND_STEERING is not set
        # CONFIG_MTK_DEFAULT_5G_PROFILE is not set
        # CONFIG_MTK_MAC_REPEATER_SUPPORT is not set
        # CONFIG_MTK_MULTI_PROFILE_SUPPORT is not set
        # CONFIG_MTK_PCIE_ASPM_DYM_CTRL_SUPPORT is not set
        # CONFIG_MTK_PRE_CAL_TRX_SET1_SUPPORT is not set
        # CONFIG_MTK_PRE_CAL_TRX_SET2_SUPPORT is not set
        # ===== 完全复刻 fanchmwrt：fwx 全家 + 专属主题由默认包注入自动选中 =====
        EOF
        make defconfig
        echo "== 闭源驱动选中状态 =="
        grep -E "CONFIG_PACKAGE_kmod-mt_wifi|CONFIG_PACKAGE_kmod-mediatek_hnat|CONFIG_PACKAGE_kmod-warp|CONFIG_PACKAGE_kmod-conninfra|CONFIG_PACKAGE_iwinfo-ucode" .config
        echo "== fanchmwrt 默认包选中状态 =="
        grep -E "CONFIG_PACKAGE_luci-theme-fanchmwrt|CONFIG_PACKAGE_kmod-fwx|CONFIG_PACKAGE_fwxd" .config

    - name: 下载编译依赖
      run: |
        cd $GITHUB_WORKSPACE
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        set -o pipefail
        cd $GITHUB_WORKSPACE
        # 阶段1：先单独构建工具链（避免 make world 并行时 libgcc_s.so 未生成导致竞态失败）
        echo "== 构建 host 工具 =="
        make tools/compile -j$(nproc) 2>&1 | tee tools.log | tail -3 || { echo "== tools 失败 =="; tail -80 tools.log; exit 1; }
        echo "== 单独构建 kernel-headers（V=s 串行，暴露补丁应用问题） =="
        make toolchain/kernel-headers/compile V=s -j1 2>&1 | tee kh.log | tail -10 || {
          echo "== kernel-headers 失败，深度诊断 =="
          echo "--- kh.log 补丁失败上下文 ---"
          grep -n -B2 -A6 "Patch failed\|Failed to apply\|patch failed" kh.log | tail -60
          echo "--- 内核源码目录 ---"
          ls -d build_dir/toolchain-*/linux-6.12.* 2>/dev/null
          KD=$(ls -d build_dir/toolchain-*/linux-6.12.* 2>/dev/null | head -1)
          if [ -n "$KD" ]; then
            echo "--- $KD/.pc 已应用补丁数 ---"
            ls "$KD/.pc/" 2>/dev/null | head -5 || true
            echo "--- jiffies.h 515-545 行 ---"
            sed -n '515,545p' "$KD/include/linux/jiffies.h" 2>/dev/null || true
            echo "--- 失败补丁 .rej 文件（失败现场） ---"
            cat "$KD/net/bluetooth/hci_event.c.rej" 2>/dev/null | head -30 || true
            echo "--- hci_event.c 38-48 行 ---"
            sed -n '38,48p' "$KD/net/bluetooth/hci_event.c" 2>/dev/null || true
            echo "--- quilt 系列应用失败详情 ---"
            cd "$KD" && quilt push -v 2>&1 | tail -30 || true
          fi
          exit 1
        }
        echo "== kernel-headers OK，构建其余工具链 =="
        make toolchain/compile -j$(nproc) 2>&1 | tee toolchain.log | tail -3 || {
          echo "== toolchain 失败诊断 =="
          tail -80 toolchain.log
          exit 1
        }
        echo "== 检查 libgcc_s.so =="
        ls -la staging_dir/toolchain-*/lib/libgcc_s.so* 2>&1 || {
          echo "libgcc_s.so 缺失！toolchain lib 目录内容："
          ls staging_dir/toolchain-*/lib/ 2>&1 | head -20
          echo "toolchain.log 尾部："
          tail -60 toolchain.log
          exit 1
        }
        echo "libgcc_s.so OK"
        # 阶段2：make world 全量编译
        make -j$(nproc) 2>&1 | tee build.log || {
          set +e
          echo "== make world 失败 =="
          echo "--- build.log 尾部 ---"
          tail -60 build.log
          echo "--- fwx 上下文 ---"
          grep -n -B3 -A3 "fwx" build.log | tail -50
          echo "== 单独重编 fwx V=s（依赖已就绪，拿真实错误） =="
          make package/fcm/fwx/compile V=s -j1 2>&1 | tee fwx-rebuild.log | tail -250
          echo "--- fwx-rebuild.log 错误行 ---"
          grep -n -E "error:|Error|undefined|No such|failed|\.c:" fwx-rebuild.log | tail -50
          echo "--- libgcc 相关 ---"
          grep -n -B3 -A3 "libgcc" build.log | tail -40
          exit 1
        }
        echo "== 编译完成 =="
        ls -lh bin/targets/mediatek/filogic/ | head -20

    - name: 查看磁盘
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      run: |
        cd $GITHUB_WORKSPACE/bin/targets/*/*
        rm -rf packages *.buildinfo profiles.json *.manifest *bl2.bin *kernel.bin *.sha sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        ls -la

    - name: 上传固件到 Releases
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: fanchmwrt-25.12.4-ax3000t-mtkclosed-${{ github.event.inputs.BUILD_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          ====================固件信息=======================
          项目：fanchmwrt/fanchmwrt (fanchmwrt-25.12.4 分支)
          内核：6.12.108
          驱动：MTK 闭源驱动（已替换开源 mt76）
          机型：小米 AX3000T（硬件 V1，stock 布局）
          默认密码：root/password
